<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img"><title>Graphe partagé contre arbre</title><rect x="0" y="0" width="1000" height="560" rx="12" fill="#0e131a"/><text x="40" y="42" fill="#8fa8ff" font-size="11.5" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">MÉMOIRE</text><text x="40" y="72" fill="#e4e9f0" font-size="24" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">Un graphe partagé, pas un arbre</text><text x="40" y="98" fill="#98a5b7" font-size="14" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">À gauche, l&#x27;expression telle qu&#x27;on l&#x27;écrit : un arbre qui recopie x quatre fois. À droite, ce que</text><text x="40" y="117" fill="#98a5b7" font-size="14" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">SymAlgo++ garde en mémoire, avec la dérivée f′ : x et sin(x) servent aux deux sans être copiés.</text><g transform="translate(60 140) scale(1.2)"><line x1="180" y1="42" x2="100" y2="88" stroke="#98a5b7" stroke-width="1.2"/><line x1="180" y1="42" x2="260" y2="88" stroke="#98a5b7" stroke-width="1.2"/><line x1="100" y1="112" x2="60" y2="158" stroke="#98a5b7" stroke-width="1.2"/><line x1="100" y1="112" x2="140" y2="158" stroke="#98a5b7" stroke-width="1.2"/><line x1="260" y1="112" x2="220" y2="158" stroke="#98a5b7" stroke-width="1.2"/><line x1="260" y1="112" x2="300" y2="158" stroke="#98a5b7" stroke-width="1.2"/><line x1="140" y1="182" x2="140" y2="233" stroke="#98a5b7" stroke-width="1.2"/><line x1="300" y1="182" x2="300" y2="233" stroke="#98a5b7" stroke-width="1.2"/><rect x="162" y="18" width="36" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1"/><text x="180.0" y="35" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">+</text><rect x="82" y="88" width="36" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1"/><text x="100.0" y="105" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">×</text><rect x="242" y="88" width="36" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1" stroke-dasharray="4 3"/><text x="260.0" y="105" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">×</text><rect x="42" y="158" width="36" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1"/><text x="60.0" y="175" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">x</text><rect x="118" y="158" width="44" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1"/><text x="140.0" y="175" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">sin</text><rect x="202" y="158" width="36" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1" stroke-dasharray="4 3"/><text x="220.0" y="175" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">x</text><rect x="278" y="158" width="44" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1" stroke-dasharray="4 3"/><text x="300.0" y="175" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">sin</text><rect x="122" y="233" width="36" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1" stroke-dasharray="4 3"/><text x="140.0" y="250" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">x</text><rect x="282" y="233" width="36" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1" stroke-dasharray="4 3"/><text x="300.0" y="250" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">x</text></g><g transform="translate(530 140) scale(1.1)"><text x="95" y="22" fill="#e4e9f0" font-size="12.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">f = 2*x*sin(x)</text><text x="300" y="22" fill="#e4e9f0" font-size="12.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">f′ = 2*x*cos(x) + 2*sin(x)</text><line x1="95" y1="72" x2="150" y2="138" stroke="#98a5b7" stroke-width="1.2"/><path d="M 80 72 C 50 170, 110 255, 186 255" fill="none" stroke="#98a5b7" stroke-width="1.2"/><line x1="150" y1="162" x2="196" y2="243" stroke="#98a5b7" stroke-width="1.2"/><line x1="300" y1="72" x2="160" y2="138" stroke="#8fa8ff" stroke-width="1.2"/><line x1="300" y1="72" x2="330" y2="128" stroke="#8fa8ff" stroke-width="1.2"/><line x1="330" y1="152" x2="210" y2="243" stroke="#8fa8ff" stroke-width="1.2"/><line x1="330" y1="152" x2="330" y2="203" stroke="#8fa8ff" stroke-width="1.2"/><line x1="330" y1="227" x2="214" y2="252" stroke="#8fa8ff" stroke-width="1.2"/><text x="222" y="98" fill="#8fa8ff" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">×2</text><text x="336" y="104" fill="#8fa8ff" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">×2</text><rect x="40" y="48" width="110" height="24" rx="4" fill="#1a2340" stroke="#8fa8ff" stroke-width="1"/><text x="95.0" y="65" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">Produit ×2</text><rect x="262" y="48" width="76" height="24" rx="4" fill="#1a2340" stroke="#8fa8ff" stroke-width="1"/><text x="300.0" y="65" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">Somme</text><rect x="296" y="128" width="68" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1"/><text x="330.0" y="145" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">Produit</text><rect x="308" y="203" width="44" height="24" rx="4" fill="#151c26" stroke="#98a5b7" stroke-width="1"/><text x="330.0" y="220" fill="#e4e9f0" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">cos</text><rect x="126" y="138" width="48" height="24" rx="4" fill="#2a2213" stroke="#efb24f" stroke-width="1.5"/><text x="150.0" y="155" fill="#efb24f" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">sin</text><rect x="186" y="243" width="36" height="24" rx="4" fill="#2a2213" stroke="#efb24f" stroke-width="1.5"/><text x="204.0" y="260" fill="#efb24f" font-size="12" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="middle" xml:space="preserve">x</text></g><line x1="500" y1="150" x2="500" y2="480" stroke="#283241"/><text x="60" y="500" fill="#e4e9f0" font-size="15" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">Tel qu&#x27;écrit : 9 noeuds</text><text x="60" y="520" fill="#98a5b7" font-size="12.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">En pointillés : les copies de x, sin(x) et du produit.</text><text x="530" y="500" fill="#e4e9f0" font-size="15" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">En mémoire : 6 noeuds pour f et f′</text><text x="530" y="520" fill="#98a5b7" font-size="12.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">En ambre : les noeuds partagés. Arêtes bleues : celles de f′.</text><text x="530" y="537" fill="#98a5b7" font-size="12.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">Les coefficients ×2 sont portés par les arêtes, pas par des noeuds.</text></svg>
