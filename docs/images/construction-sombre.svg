<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img"><title>Construction canonique et hash-consing</title><rect x="0" y="0" width="1000" height="392" rx="12" fill="#0e131a"/><text x="40" y="42" fill="#8fa8ff" font-size="11.5" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">CONSTRUCTION</text><text x="40" y="72" fill="#e4e9f0" font-size="24" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">Ce qui se passe quand vous écrivez x*sin(x) + x*sin(x)</text><text x="40" y="98" fill="#98a5b7" font-size="14" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">Aucune étape de simplification séparée : chaque opération produit directement la forme</text><text x="40" y="117" fill="#98a5b7" font-size="14" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">réduite, puis vérifie si elle existe déjà en mémoire.</text><rect x="40.0" y="140" width="174.4" height="222" rx="8" fill="#151c26" stroke="#283241" stroke-width="1"/><text x="54.0" y="170" fill="#8fa8ff" font-size="20" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">1</text><text x="54.0" y="196" fill="#e4e9f0" font-size="14" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">Vous écrivez</text><rect x="52.0" y="210" width="150.4" height="50" rx="4" fill="#111821"/><text x="60.0" y="228" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">lire(&quot;x*sin(x)</text><text x="60.0" y="244" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">  + x*sin(x)&quot;)</text><text x="54.0" y="282" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">Texte ou helpers C++,</text><text x="54.0" y="299" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">même résultat.</text><line x1="215.4" y1="251.0" x2="218.4" y2="251.0" stroke="#98a5b7" stroke-width="1.5"/><path d="M 218.4 255.5 L 218.4 246.5 L 225.4 251.0 Z" fill="#98a5b7"/><rect x="226.4" y="140" width="174.4" height="222" rx="8" fill="#151c26" stroke="#283241" stroke-width="1"/><text x="240.4" y="170" fill="#8fa8ff" font-size="20" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">2</text><text x="240.4" y="196" fill="#e4e9f0" font-size="14" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">Regroupement</text><rect x="238.4" y="210" width="150.4" height="50" rx="4" fill="#111821"/><text x="246.4" y="228" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">x·sin(x) : 1</text><text x="246.4" y="244" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">x·sin(x) : 1 + 1 = 2</text><text x="240.4" y="282" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">Termes identiques</text><text x="240.4" y="299" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">fusionnés, coefficients</text><text x="240.4" y="316" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">exacts.</text><line x1="401.8" y1="251.0" x2="404.8" y2="251.0" stroke="#98a5b7" stroke-width="1.5"/><path d="M 404.8 255.5 L 404.8 246.5 L 411.8 251.0 Z" fill="#98a5b7"/><rect x="412.8" y="140" width="174.4" height="222" rx="8" fill="#151c26" stroke="#283241" stroke-width="1"/><text x="426.8" y="170" fill="#8fa8ff" font-size="20" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">3</text><text x="426.8" y="196" fill="#e4e9f0" font-size="14" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">Signature</text><rect x="424.8" y="210" width="150.4" height="66" rx="4" fill="#111821"/><text x="432.8" y="228" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">Produit</text><text x="432.8" y="244" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">coefficient 2</text><text x="432.8" y="260" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">facteurs [x, sin(x)]</text><text x="426.8" y="298" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">Type, valeurs et</text><text x="426.8" y="315" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">adresses des enfants.</text><line x1="588.2" y1="251.0" x2="591.2" y2="251.0" stroke="#98a5b7" stroke-width="1.5"/><path d="M 591.2 255.5 L 591.2 246.5 L 598.2 251.0 Z" fill="#98a5b7"/><rect x="599.2" y="140" width="174.4" height="222" rx="8" fill="#151c26" stroke="#283241" stroke-width="1"/><text x="613.2" y="170" fill="#8fa8ff" font-size="20" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">4</text><text x="613.2" y="196" fill="#e4e9f0" font-size="14" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">Recherche</text><rect x="611.2" y="210" width="150.4" height="66" rx="4" fill="#111821"/><text x="619.2" y="228" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">existe déjà ?</text><text x="619.2" y="244" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">  oui → réutilisé</text><text x="619.2" y="260" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">  non → alloué</text><text x="613.2" y="298" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">Table de hachage</text><text x="613.2" y="315" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">intrusive : une</text><text x="613.2" y="332" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">allocation au plus.</text><line x1="774.6" y1="251.0" x2="777.6" y2="251.0" stroke="#98a5b7" stroke-width="1.5"/><path d="M 777.6 255.5 L 777.6 246.5 L 784.6 251.0 Z" fill="#98a5b7"/><rect x="785.6" y="140" width="174.4" height="222" rx="8" fill="#2a2213" stroke="#efb24f" stroke-width="1"/><text x="799.6" y="170" fill="#efb24f" font-size="20" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">5</text><text x="799.6" y="196" fill="#e4e9f0" font-size="14" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="start" xml:space="preserve">Un ExprPtr</text><rect x="797.6" y="210" width="150.4" height="34" rx="4" fill="#111821"/><text x="805.6" y="228" fill="#e4e9f0" font-size="11" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="start" xml:space="preserve">2*x*sin(x)</text><text x="799.6" y="266" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">3 noeuds en mémoire.</text><text x="799.6" y="283" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">Réécrire la même</text><text x="799.6" y="300" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">expression rend le</text><text x="799.6" y="317" fill="#98a5b7" font-size="12" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="start" xml:space="preserve">même pointeur.</text></svg>
